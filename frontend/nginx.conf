# ERP frontend — static SPA + reverse proxy to the backend on one origin.
# The container name "backend" resolves via the compose network; override with
# BACKEND_URL at build time or edit this file for another topology.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the fingerprinted assets, never cache the HTML entrypoint.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + Swagger -> backend. Same origin, so no CORS is involved in production.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback — every other path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
